<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Metallic Shine -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="4" y="4" width="92" height="92" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Subtle Shine Overlay -->
  <path d="M 8,32 Q 50,8 92,32 L 92,8 Q 50,8 8,8 Z" fill="url(#shineGrad)" opacity="0.6" />

  <!-- ZAH Monogram Text -->
  <g text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif">
    <!-- Main ZAH letter -->
    <text x="44" y="62" font-size="38" font-weight="900" fill="url(#goldGrad)" letter-spacing="-1">Z</text>
    <text x="68" y="62" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-0.5">g</text>
    <circle cx="78" cy="46" r="3.5" fill="url(#goldGrad)" />
  </g>
</svg>
